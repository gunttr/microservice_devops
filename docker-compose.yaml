x-logging: &default-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"
    tag: docker.{{.Name}}

services:
  
  # proxy
  nginx:
    image: nginx:1.31.6-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8000:80"
    networks:
      - microservices_devops

  postgres:
    image: postgres:18
    container_name: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - microservices_devops

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - microservices_devops

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    restart: no
    command: >
      sh -c "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic orders --bootstrap-server kafka:9092 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic payments --bootstrap-server kafka:9092 &&
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic notifications --bootstrap-server kafka:9092
      "
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices_devops
    
# observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0-amd64
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "24224:24224"
    volumes:
      - ./configs/otel-collector.yaml:/etc/otel-collector-config.yaml
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector-config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices_devops

  sql_exporter:
    image: burningalchemist/sql_exporter:0.24.8
    container_name: sql_exporter
    restart: unless-stopped
    volumes:
      - ./configs/sql_exporter.yaml:/config/sql_exporter.yaml
    command:
      - "-config.file"
      - "/config/sql_exporter.yaml"
    environment:
      SQLEXPORTER_TARGET_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9399/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices_devops

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090" # стандартный порт
    volumes:
      - ./configs/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-data:/prometheus/data
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml" # путь к конфигу
      - --storage.tsdb.path=/prometheus/data" # путь к хранению tsdb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microservices_devops

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    restart: unless-stopped
    # command: 
    #   - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    networks:
      - microservices_devops

  grafana:
    image: grafana/grafana:13.0-slim
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - microservices_devops
    

  order_service:
    build: order_service/
    image: ghcr.io/gunttr/order_service:test-amd64
    container_name: order_service
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      KAFKA_HOSTNAME: "kafka"
      KAFKA_PORT: "9092"
      KAFKA_GROUP_ID: "order_service"

      LOG_LEVEL: "INFO"

      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector:4318/v1/metrics"
      OTEL_EXPORTER_OTLP_TIMEOUT: 15000 # 15 секунд
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: 15000 # 15 секунд
      
    restart: always
    networks:
      - microservices_devops
    depends_on:
      kafka-init:
        condition: service_completed_successfully


  payment_service:
    build: payment_service/
    image: ghcr.io/gunttr/payment_service:test-amd64
    container_name: payment_service
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      LOG_LEVEL: "INFO"

      KAFKA_HOSTNAME: "kafka"
      KAFKA_PORT: "9092"
      KAFKA_GROUP_ID: "payment_service"

      OTEL_EXPORTER_OLTP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector:4318/v1/metrics"
      OTEL_EXPORTER_OTLP_TIMEOUT: 15000 # 15 секунд
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: 15000 # 15 секунд
    restart: always
    networks:
      - microservices_devops
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notification_service:
    build: notification_service/
    image: ghcr.io/gunttr/notification_service:test-amd64
    container_name: notification_service
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    environment:
      KAFKA_HOSTNAME: "kafka"
      KAFKA_PORT: "9092"
      KAFKA_GROUP_ID: "notification_service"

      LOG_LEVEL: "INFO"

      OTEL_EXPORTER_OLTP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector:4318/v1/metrics"
      OTEL_EXPORTER_OTLP_TIMEOUT: 15000 # 15 секунд
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: 15000 # 15 секунд

    networks:
      - microservices_devops
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  test-api-script:
    build: test-api-script/
    image: ghcr.io/gunttr/test-api-script:test-amd64
    container_name: test-api-script
    restart: unless-stopped
    environment:
      API_ENDPOINT: "http://nginx:80"
      TIME_TO_SLEEP_SECONDS: 180
      REQUESTS_PER_ITERATION: 20
    networks:
      - microservices_devops


volumes:
  pgdata:
    driver: local
  kafka-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  microservices_devops:
    driver: bridge