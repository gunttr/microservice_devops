receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

exporters:
  prometheus:
    endpoint: "0.0.0.0:8089"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133 # такой дебильный дефолтный порт
    path: /

service:
  extensions: [health_check]

  pipelines:
    metrics: 
      receivers: [otlp]
      exporters: [prometheus]
