apiVersion: v1
kind: Service
metadata:
  name: &name prometheus-headless
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: observability
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: *name
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: &name prometheus
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: *name
  ports:
  - port: 9090
    targetPort: 9090
