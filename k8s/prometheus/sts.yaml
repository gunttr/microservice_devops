apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &name prometheus
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: &version "3.13.3"
    app.kubernetes.io/part-of: &part-of microservice-devops
    app.kubernetes.io/component: &component observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/part-of: *part-of
      app.kubernetes.io/component: *component
  serviceName: prometheus-headless
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/part-of: *part-of
        app.kubernetes.io/component: *component
    spec:
      containers:
      - name: *name
        image: prom/prometheus:v3.13.3
        imagePullPolicy: IfNotPresent

        args: 
          - "--config.file=/etc/prometheus/prometheus.yaml" # путь к конфигу
          - --storage.tsdb.path=/prometheus/data" # путь к хранению tsdb

        ports:
        - name: web 
          containerPort: 9090

        resources:
          requests:
            cpu: "250m"
            memory: "250Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        
        startupProbe:
          httpGet:
            port: web
            path: /-/healthy
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        
        readinessProbe:
          httpGet:
            port: web
            path: /-/healthy
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        
        livenessProbe:
          httpGet:
            port: web
            path: /-/healthy
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
          - name: prometheus-data
            mountPath: /prometheus/data
          - name: prometheus-config
            mountPath: /etc/prometheus/prometheus.yaml
            subPath: prometheus.yaml
      
      volumes:
        - name: prometheus-data
          hostPath:
            path: /var/lib/prometheus/data
        
        - name: prometheus-config
          configMap:
            name: prometheus
