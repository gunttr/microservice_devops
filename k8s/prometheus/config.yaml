apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8089"] # отсюда идут метрики с 3 микросервисов
      - job_name: sql_exporter
        static_configs:
          - targets: ["sql-exporter:9399"] # отсюда идут метрики с бд 
