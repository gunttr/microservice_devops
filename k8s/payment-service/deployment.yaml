apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name payment-service
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: &version "1.2"
    app.kubernetes.io/part-of: &part-of microservice-devops
    app.kubernetes.io/component: &component backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/part-of: *part-of
      app.kubernetes.io/component: *component
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/part-of: *part-of
        app.kubernetes.io/component: *component
    spec:
      containers:
      - name: *name
        image: ghcr.io/gunttr/payment_service:1.2-amd64
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        ports:
        - containerPort: 8000
        env:
          - name: OTEL_SERVICE_NAME
            value: *name
          - name: KAFKA_GROUP_ID
            value: *name
        envFrom:
        - configMapRef:
            name: otel
        - configMapRef:
            name: kafka
        - configMapRef:
            name: pgsql
        - secretRef:
            name: pgsql
