apiVersion: v1
kind: Service
metadata:
  name: &name kafka
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: *name
    app.kubernetes.io/component: broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: *name
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: &name kafka-headless
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: *name
    app.kubernetes.io/component: broker
spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: kafka

  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
