apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &name postgres
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: &version "18"
    app.kubernetes.io/part-of: &part-of microservice-devops
    app.kubernetes.io/component: &component database
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/part-of: *part-of
      app.kubernetes.io/component: *component
  serviceName: postgres-headless
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/part-of: *part-of
        app.kubernetes.io/component: *component
    spec:
      containers:
      - name: *name
        image: postgres:18
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5432

        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pgsql
                key: POSTGRES_PASSWORD

        resources:
          requests:
            cpu: "250m"
            memory: "250Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        
        startupProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d postgres
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 10
        
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d postgres
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U postgres -d postgres
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql
          - name: initdb
            mountPath: /docker-entrypoint-initdb.d
      
      volumes:
        - name: postgres-data
          hostPath:
            path: /var/lib/postgresql/data
          
        - name: initdb
          configMap:
            name: initdb
