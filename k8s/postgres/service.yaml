apiVersion: v1
kind: Service
metadata:
  name: &name postgres-headless
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: *name
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: &name postgres
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: *name
  ports:
  - port: 5432
    targetPort: 5432
