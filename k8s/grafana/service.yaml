apiVersion: v1
kind: Service
metadata:
  name: &name grafana-headless
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: observability
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: *name
  ports:
