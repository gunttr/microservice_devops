apiVersion: v1
kind: Service
metadata:
  name: &name otel-collector
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: *name
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: *name
  ports:
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: prometheus
    port: 8089
    targetPort: 8089
  type: ClusterIP
