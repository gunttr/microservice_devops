apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name otel-collector
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: &version "0.160.0"
    app.kubernetes.io/part-of: &part-of microservice-devops
    app.kubernetes.io/component: &component observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/part-of: *part-of
      app.kubernetes.io/component: *component
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/part-of: *part-of
        app.kubernetes.io/component: *component
    spec:
      containers:
      - name: *name
        image: otel/opentelemetry-collector-contrib:0.160.0-amd64
        imagePullPolicy: IfNotPresent
        args: 
          - "--config=/etc/otel-collector/config.yaml"

        ports:
        - name: healthz
          containerPort: 13133
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: prometheus
          containerPort: 8089
          protocol: TCP

        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        
        volumeMounts:
          - name: config
            mountPath: /etc/otel-collector
            readOnly: true

      volumes:
        - name: config
          configMap:
            name: otel-collector-config
