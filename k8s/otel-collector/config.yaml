apiVersion: v1
kind: ConfigMap
metadata:
  name: &name otel-collector-config
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: otel-collector
    app.kubernetes.io/component: observability 
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8089"

      debug:
        verbosity: detailed

      otlphttp/logs:
        endpoint: "http://loki:3100/otlp"
        tls:
          insecure: true

      otlp/jaeger:
        endpoint: "http://jaeger:4317"
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133 # такой дебильный дефолтный порт. в компоузе бесполезно, но для кубера норм будет
        path: /

    service:
      extensions: [health_check]

      pipelines:
        metrics: 
          receivers: [otlp]
          exporters: [debug, prometheus]
        logs:
          receivers: [otlp]
          exporters: [debug, otlphttp/logs]
        traces:
          receivers: [otlp]
          exporters: [debug, otlp/jaeger]
      