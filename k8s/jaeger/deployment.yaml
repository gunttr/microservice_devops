apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name jaeger
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: &version "2.20.0"
    app.kubernetes.io/part-of: &part-of microservice-devops
    app.kubernetes.io/component: &component observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/part-of: *part-of
      app.kubernetes.io/component: *component
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/part-of: *part-of
        app.kubernetes.io/component: *component
        
    spec:
      containers:
      - name: *name
        image: jaegertracing/jaeger:2.20.0 
        imagePullPolicy: IfNotPresent

        ports:
          - name: web
            containerPort: 16686
          - name: healthz
            containerPort: 13133
          - name: otlp-grpc
            containerPort: 4317

        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"

          limits:
            memory: "128Mi"
            cpu: "500m"
        
        startupProbe:
          httpGet:
            port: healthz
            path: /status
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        readinessProbe:
          httpGet:
            port: healthz
            path: /status
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
          
        livenessProbe:
          httpGet:
            port: healthz
            path: /status
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
