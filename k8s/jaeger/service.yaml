apiVersion: v1
kind: Service
metadata:
  name: &name jaeger
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: observability
spec:
  selector:
    app.kubernetes.io/name: *name
  ports:
  - name: web
    port: 16686
    targetPort: 16686
  - name: otlp-grpc
    port: 4317
    targetPort: 4317

  type: ClusterIP
