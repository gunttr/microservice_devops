apiVersion: v1
kind: Service
metadata:
  name: &name loki-headless
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/part-of: microservice-devops
    app.kubernetes.io/component: observability
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: *name
  ports:
  - port: 3100
    targetPort: 3100
